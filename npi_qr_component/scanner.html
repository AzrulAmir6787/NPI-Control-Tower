<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>NPI — Scan QR</title>
<style>*{box-sizing:border-box}html{min-height:100%;color-scheme:light dark}body{margin:0;padding:16px;background:#eef3f8;color:#142033;font:16px/1.4 Arial,Helvetica,sans-serif}main{width:100%;max-width:960px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;background:linear-gradient(115deg,#20354f,#253f5b);color:white;padding:12px 16px;border-radius:10px}h1{margin:0;font-size:22px}p{overflow-wrap:anywhere}.camera{margin-top:14px;position:relative;background:#101820;border-radius:10px;overflow:hidden;min-height:200px}video{display:block;width:100%;height:clamp(220px,58dvh,620px);object-fit:contain}.aim{position:absolute;inset:15% 20%;border:2px solid #34ced1;border-radius:14px;pointer-events:none}.panel{padding:14px 16px;border:1px solid #dfe7f0;border-radius:10px;background:white;margin-top:14px}#status{margin:0 0 8px}#part{font-weight:700;margin:0;overflow-wrap:anywhere}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}button,a{min-height:44px;padding:10px 18px;font:600 15px Arial;border-radius:6px;border:1px solid #7b91aa;cursor:pointer}button{color:#142033;background:#edf4fa}button.primary{color:white;background:linear-gradient(115deg,#0795aa,#047c90);border-color:#078399}.top button{background:transparent;color:white;border-color:#91a2b7}button:disabled{opacity:.5}[hidden]{display:none!important}.hint{font-size:14px;color:#52667d;margin-bottom:0}@media(max-height:520px) and (min-width:600px){body{padding:10px}main{display:grid;grid-template-columns:1.1fr 1fr;gap:10px;max-width:none}.top{grid-column:1/-1}.camera,.panel{margin-top:0}video{height:calc(100dvh - 90px);min-height:180px}.panel{align-self:start}}@media(prefers-color-scheme:dark){body{background:#101923;color:#f3f7fb}.panel{background:#1b2735;border-color:#425468}.hint{color:#b7c7da}button{background:#26384b;color:white}}</style></head>
<body><main><header class="top"><h1>Scan QR</h1><button id="close">× Close</button></header><section class="camera" aria-label="Camera preview"><video id="preview" autoplay muted playsinline></video><div class="aim"></div></section><section class="panel"><p id="status" role="status" aria-live="polite">Preparing camera…</p><p id="part"></p><p class="hint">Point the rear camera at a Part Number QR code.</p><div class="actions"><button id="retry" class="primary" hidden>Retry camera</button><button id="cancel">Cancel</button><button id="open-detail" class="primary" hidden>Open Part Detail</button></div></section></main><!--NPI_QR_BOOTSTRAP--></body></html>
